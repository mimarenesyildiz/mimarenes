<svg class="mtk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
<style>.mtk{--ink:var(--gray-900,#1a1a1a);--ink2:var(--gray-600,#444);--ink3:var(--gray-400,#6b6b6b);--paper:var(--bg,#f8f8f8);--hot:var(--accent,#C56F34)}
.mtk .ink{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.mtk .ink.h{stroke-width:1.2;opacity:.5}
.mtk .solid{fill:var(--ink)}
.mtk .poche{fill:var(--ink);fill-opacity:.1}
.mtk .fur{fill:none;stroke:var(--ink2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mtk .top{fill:var(--hot);fill-opacity:.17;stroke:none}
.mtk .cover{fill:var(--paper);stroke:none}
.mtk text{font-family:var(--mono,'SF Mono','Fira Code',monospace);letter-spacing:0;font-variant-numeric:tabular-nums;user-select:none}
.mtk .draw{stroke-dasharray:1 2;animation:mtk-draw var(--t,.8s) cubic-bezier(.45,0,.2,1) var(--d,0s) backwards}
.mtk .pop{transform-box:fill-box;transform-origin:50% 50%;animation:mtk-pop var(--t,.35s) cubic-bezier(.3,1.5,.5,1) var(--d,0s) backwards}
.mtk .fade{animation:mtk-fade var(--t,.5s) ease var(--d,0s) backwards}
@keyframes mtk-draw{from{stroke-dashoffset:1.01}}
@keyframes mtk-pop{from{transform:scale(0)}}
@keyframes mtk-fade{from{opacity:0}}
.mtk{--T:16.0s;--d0:1.6s}
.mtk .root{transform:translateX(32px)}
.mtk .ridge{fill:none;stroke:var(--ink3);stroke-width:1;stroke-linecap:round}
.mtk .was{fill:none;stroke:var(--ink2);stroke-width:1.3;stroke-dasharray:5 4}
.mtk .ghost{fill:none;stroke:var(--hot);stroke-width:1.1;opacity:0}
.mtk .blk{transform-origin:457.5px 205px;transform:translate(-3.75px,-33.75px) rotate(-235deg);animation:mtk-blk var(--T) linear var(--d0) infinite backwards}
.mtk .bfill{fill:var(--paper);animation:mtk-bfill var(--T) linear var(--d0) infinite backwards}
.mtk .bwash{fill:var(--hot);fill-opacity:.1}
.mtk .bline{fill:none;stroke:var(--hot);stroke-width:2.6;stroke-linejoin:round}
.mtk .salon{fill:var(--hot);fill-opacity:.62;animation:mtk-lit var(--T) linear var(--d0) infinite backwards}
.mtk .salonl{fill:none;stroke:var(--hot);stroke-width:1.1}
.mtk .tk{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round}
.mtk .ax{font-size:12px;fill:var(--ink3)}
.mtk .cap{font-size:13px;fill:var(--ink3)}
.mtk .dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.mtk .d0{fill:var(--ink)}
.mtk .d2{stroke:var(--hot)}
.mtk .d3{fill:var(--hot);stroke:var(--hot)}
.mtk .vn{font-size:16px;font-weight:600;fill:var(--ink)}
.mtk .v3{fill:var(--hot)}
.mtk .nm{font-size:13px;fill:var(--ink3)}
.mtk .hd{font-size:54px;font-weight:600;fill:var(--hot);--motion-count:250;animation:mtk-cnt var(--T) linear var(--d0) infinite backwards}
.mtk .hlt{font-size:14px;fill:var(--ink2)}
.mtk .gain{animation:mtk-gain var(--T) linear var(--d0) infinite backwards}
.mtk .dyn{animation:mtk-dip var(--T) linear var(--d0) infinite backwards}
.mtk .g0{animation:mtk-g0 var(--T) linear var(--d0) infinite backwards}.mtk .g1{animation:mtk-g1 var(--T) linear var(--d0) infinite backwards}.mtk .g2{animation:mtk-g2 var(--T) linear var(--d0) infinite backwards}.mtk .g3{animation:mtk-g3 var(--T) linear var(--d0) infinite backwards}.mtk .g4{animation:mtk-g4 var(--T) linear var(--d0) infinite backwards}
.mtk .s1{animation:mtk-s1 var(--T) linear var(--d0) infinite backwards}.mtk .s2{animation:mtk-s2 var(--T) linear var(--d0) infinite backwards}.mtk .s3{animation:mtk-s3 var(--T) linear var(--d0) infinite backwards}
@keyframes mtk-blk{0%,5%{transform:translate(0px,0px) rotate(0deg);animation-timing-function:cubic-bezier(.65,0,.25,1)}10%,13.75%{transform:translate(3px,-5.25px) rotate(0deg);animation-timing-function:cubic-bezier(.65,0,.25,1)}17.5%{transform:translate(0px,0px) rotate(0deg);animation-timing-function:cubic-bezier(.65,0,.25,1)}35%,40%{transform:translate(0px,-8.25px) rotate(-234deg);animation-timing-function:cubic-bezier(.65,0,.25,1)}46.25%,92.438%{transform:translate(-3.75px,-33.75px) rotate(-235deg)}92.5%,100%{transform:translate(0px,0px) rotate(0deg)}}
@keyframes mtk-bfill{0%,17.5%{opacity:1}19.375%,33.125%{opacity:.25}35%,100%{opacity:1}}
@keyframes mtk-lit{0%,33.125%{fill-opacity:.2}35%,44.375%{fill-opacity:.38}46.25%,92.438%{fill-opacity:.62}92.5%,100%{fill-opacity:.2}}
@keyframes mtk-g0{0%,23.311%{opacity:0}24.249%,38.125%{opacity:.75}42.5%,100%{opacity:0}}
@keyframes mtk-g1{0%,24.682%{opacity:0}25.619%,38.125%{opacity:.75}42.5%,100%{opacity:0}}
@keyframes mtk-g2{0%,25.594%{opacity:0}26.531%,38.125%{opacity:.75}42.5%,100%{opacity:0}}
@keyframes mtk-g3{0%,26.573%{opacity:0}27.511%,38.125%{opacity:.75}42.5%,100%{opacity:0}}
@keyframes mtk-g4{0%,28.181%{opacity:0}29.118%,38.125%{opacity:.75}42.5%,100%{opacity:0}}
@keyframes mtk-s1{0%,10%{opacity:0}11.875%,92.438%{opacity:1}92.5%,100%{opacity:0}}
@keyframes mtk-s2{0%,35%{opacity:0}36.875%,92.438%{opacity:1}92.5%,100%{opacity:0}}
@keyframes mtk-s3{0%,46.25%{opacity:0}48.125%,92.438%{opacity:1}92.5%,100%{opacity:0}}
@keyframes mtk-gain{0%,46.875%{opacity:0}48.75%,92.438%{opacity:1}92.5%,100%{opacity:0}}
@keyframes mtk-cnt{0%,48.75%{--motion-count:0}60%,92.438%{--motion-count:250}92.5%,100%{--motion-count:0}}
@keyframes mtk-dip{0%,88.75%{opacity:1}91.25%,93.75%{opacity:0}96.25%,100%{opacity:1}}
@media (min-width:769px) and (max-width:1100px){.mtk .ax{font-size:15px}.mtk .cap{font-size:16px}.mtk .vn{font-size:19px}.mtk .nm{font-size:16px}.mtk .hlt{font-size:17px}}
@media (max-width:768px){.mtk .root{transform:none}.mtk .col{transform:translateX(-8px)}.mtk .ink{stroke-width:2.2}.mtk .ink.h{stroke-width:1.8}.mtk .fur{stroke-width:2}.mtk .ridge{stroke-width:1.5}.mtk .was{stroke-width:1.9}.mtk .ghost{stroke-width:1.6}.mtk .bline{stroke-width:3.4}.mtk .salonl{stroke-width:1.6}.mtk .tk{stroke-width:1.9}.mtk .dot{stroke-width:2.4}.mtk .ax{font-size:18px}.mtk .cap{font-size:19px}.mtk .vn{font-size:22px}.mtk .nm{display:none}.mtk .hlt{font-size:19px}.mtk .hl{transform:translate(-102px,46px)}}</style>
