<svg class="mgv" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
<style>.mgv{--ink:var(--gray-900,#1a1a1a);--ink2:var(--gray-600,#444);--ink3:var(--gray-400,#6b6b6b);--paper:var(--bg,#f8f8f8);--hot:var(--accent,#C56F34)}
.mgv .ink{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.mgv .ink.h{stroke-width:1.2;opacity:.5}
.mgv .solid{fill:var(--ink)}
.mgv .poche{fill:var(--ink);fill-opacity:.1}
.mgv .fur{fill:none;stroke:var(--ink2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mgv .top{fill:var(--hot);fill-opacity:.17;stroke:none}
.mgv .cover{fill:var(--paper);stroke:none}
.mgv text{font-family:var(--mono,'SF Mono','Fira Code',monospace);letter-spacing:0;font-variant-numeric:tabular-nums;user-select:none}
.mgv .draw{stroke-dasharray:1 2;animation:mgv-draw var(--t,.8s) cubic-bezier(.45,0,.2,1) var(--d,0s) backwards}
.mgv .pop{transform-box:fill-box;transform-origin:50% 50%;animation:mgv-pop var(--t,.35s) cubic-bezier(.3,1.5,.5,1) var(--d,0s) backwards}
.mgv .fade{animation:mgv-fade var(--t,.5s) ease var(--d,0s) backwards}
@keyframes mgv-draw{from{stroke-dashoffset:1.01}}
@keyframes mgv-pop{from{transform:scale(0)}}
@keyframes mgv-fade{from{opacity:0}}
.mgv{--T:13.0s;--d0:1.5s;--xl:-410px;--xr:410px}
.mgv .bg{fill:var(--paper)}
.mgv .frame{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.mgv .tex{fill-opacity:.55}
.mgv .obj{fill:none;stroke:var(--ink2);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.mgv .mask{fill:var(--hot);fill-opacity:.42}
.mgv .bbox{fill:none;stroke:var(--hot);stroke-width:1.2;stroke-dasharray:4 3}
.mgv .crv{fill:var(--hot);fill-opacity:.2;stroke:var(--hot);stroke-width:2}
.mgv .ghost{fill:none;stroke:var(--ink3);stroke-width:1.1;stroke-dasharray:1.5 5;stroke-linecap:round;opacity:.7}
.mgv .arrow{fill:none;stroke:var(--ink3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mgv .scan{stroke:var(--hot);stroke-width:2;stroke-linecap:round;opacity:0;animation:mgv-scan var(--T) linear var(--d0) infinite backwards}
.mgv .dots{fill:var(--ink3)}
.mgv .dyn{animation:mgv-dip var(--T) linear var(--d0) infinite backwards}
.mgv .raw{opacity:0;animation:mgv-raw var(--T) linear var(--d0) infinite backwards}
.mgv .ma{opacity:0;animation:mgv-ma var(--T) linear var(--d0) infinite backwards}
.mgv .mb{opacity:0;animation:mgv-mb var(--T) linear var(--d0) infinite backwards}
.mgv .crv{animation:mgv-crv var(--T) linear var(--d0) infinite backwards}
.mgv .ffloor{transform:translate(0px,0px) matrix(0.866,0.5,-0.866,0.5,600,210);animation:mgv-fade .5s ease 0.35s backwards,mgv-ffloor var(--T) linear var(--d0) infinite backwards}.mgv .fN{transform:translate(0px,0px) matrix(0.866,0.5,0,1,600,90);animation:mgv-fade .5s ease 0.35s backwards,mgv-fN var(--T) linear var(--d0) infinite backwards}.mgv .fW{transform:translate(0px,0px) matrix(-0.866,0.5,0,1,600,90);animation:mgv-fade .5s ease 0.35s backwards,mgv-fW var(--T) linear var(--d0) infinite backwards}.mgv .fS{transform:translate(0px,0px) matrix(0.866,0.5,0,1,496.08,150);animation:mgv-fade .5s ease 0.35s backwards,mgv-fS var(--T) linear var(--d0) infinite backwards}.mgv .fE{transform:translate(0px,0px) matrix(0.866,-0.5,0,1,600,210);animation:mgv-fade .5s ease 0.5s backwards,mgv-fE var(--T) linear var(--d0) infinite backwards}.mgv .fceil{transform:translate(0px,0px) matrix(0.866,0.5,-0.866,0.5,600,90);animation:mgv-fade .5s ease 0.65s backwards,mgv-fceil var(--T) linear var(--d0) infinite backwards}
