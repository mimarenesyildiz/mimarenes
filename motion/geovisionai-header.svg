@keyframes mgv-fE{0%,6.923%{transform:translate(var(--xl),0px) matrix(0.866,-0.5,0,1,600,210);animation-timing-function:cubic-bezier(.65,0,.25,1)}17.692%,40.769%{transform:translate(0px,0px) matrix(1,0,0,1,540,82);animation-timing-function:cubic-bezier(.65,0,.25,1)}51.538%,91.462%{transform:translate(var(--xr),0px) matrix(0.866,-0.5,0,1,600,210)}91.538%,100%{transform:translate(var(--xl),0px) matrix(0.866,-0.5,0,1,600,210)}}
@keyframes mgv-fceil{0%,6.923%{transform:translate(var(--xl),0px) matrix(0.866,0.5,-0.866,0.5,600,90);animation-timing-function:cubic-bezier(.65,0,.25,1)}17.692%,40.769%{transform:translate(0px,0px) matrix(1,0,0,1,676,82);animation-timing-function:cubic-bezier(.65,0,.25,1)}51.538%,91.462%{transform:translate(var(--xr),0px) matrix(0.866,0.5,-0.866,0.5,600,90)}91.538%,100%{transform:translate(var(--xl),0px) matrix(0.866,0.5,-0.866,0.5,600,90)}}
@keyframes mgv-raw{0%,40.769%{opacity:1}47.692%,91.462%{opacity:0}91.538%,100%{opacity:1}}
@keyframes mgv-ma{0%,22.692%{opacity:0}24.615%,40.769%{opacity:1}46.154%,100%{opacity:0}}
@keyframes mgv-mb{0%,26.538%{opacity:0}28.462%,40.769%{opacity:1}46.154%,100%{opacity:0}}
@keyframes mgv-crv{0%,43.077%{opacity:0}48.462%,91.462%{opacity:1}91.538%,100%{opacity:0}}
@keyframes mgv-scan{0%,19.615%{opacity:0;transform:translateX(0px)}20.769%{opacity:1;transform:translateX(0px)}32.308%{opacity:1;transform:translateX(408px)}33.846%,100%{opacity:0;transform:translateX(408px)}}
@keyframes mgv-dip{0%,86.923%{opacity:1}90%,93.077%{opacity:0}96.154%,100%{opacity:1}}
@media (max-width:768px){.mgv{--xl:0px;--xr:0px}.mgv .ghost,.mgv .arrow{display:none}.mgv .frame{stroke-width:2.2}.mgv .obj{stroke-width:1.9}.mgv .bbox{stroke-width:1.8}.mgv .crv{stroke-width:2.8}.mgv .scan{stroke-width:3}}</style>
