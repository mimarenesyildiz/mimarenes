@keyframes mgv-fW{0%,6.923%{transform:translate(var(--xl),0px) matrix(-0.866,0.5,0,1,600,90);animation-timing-function:cubic-bezier(.65,0,.25,1)}17.692%,40.769%{transform:translate(0px,0px) matrix(1,0,0,1,540,218);animation-timing-function:cubic-bezier(.65,0,.25,1)}51.538%,91.462%{transform:translate(var(--xr),0px) matrix(-0.866,0.5,0,1,600,90)}91.538%,100%{transform:translate(var(--xl),0px) matrix(-0.866,0.5,0,1,600,90)}}
