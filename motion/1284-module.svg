<style>.m1284m{--ink:var(--gray-900,#1a1a1a);--ink2:var(--gray-600,#444);--ink3:var(--gray-400,#6b6b6b);--paper:var(--bg,#f8f8f8);--hot:var(--accent,#C56F34)}
.m1284m .ink{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.m1284m .ink.h{stroke-width:1.2;opacity:.5}
.m1284m .solid{fill:var(--ink)}
.m1284m .poche{fill:var(--ink);fill-opacity:.1}
.m1284m .fur{fill:none;stroke:var(--ink2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.m1284m .top{fill:var(--hot);fill-opacity:.17;stroke:none}
.m1284m .cover{fill:var(--paper);stroke:none}
.m1284m text{font-family:var(--mono,'SF Mono','Fira Code',monospace);letter-spacing:0;font-variant-numeric:tabular-nums;user-select:none}
.m1284m .draw{stroke-dasharray:1 2;animation:m1284m-draw var(--t,.8s) cubic-bezier(.45,0,.2,1) var(--d,0s) backwards}
.m1284m .pop{transform-box:fill-box;transform-origin:50% 50%;animation:m1284m-pop var(--t,.35s) cubic-bezier(.3,1.5,.5,1) var(--d,0s) backwards}
.m1284m .fade{animation:m1284m-fade var(--t,.5s) ease var(--d,0s) backwards}
@keyframes m1284m-draw{from{stroke-dashoffset:1.01}}
@keyframes m1284m-pop{from{transform:scale(0)}}
@keyframes m1284m-fade{from{opacity:0}}
.m1284m{--T:13.0s;--d0:0.9s}
.m1284m .row{transform:translateY(calc(46px + var(--i) * 54px))}
