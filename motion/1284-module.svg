.m1284m .cw{fill:var(--hot)}
.m1284m .co{fill:var(--hot);fill-opacity:.3}
.m1284m .cp{fill:var(--ink);fill-opacity:.15}
.m1284m .tk{fill:none;stroke:var(--ink2);stroke-width:1.2;stroke-linecap:round}
.m1284m .cv{fill:var(--paper);transform:scaleX(0);transform-box:fill-box;transform-origin:100% 50%}
