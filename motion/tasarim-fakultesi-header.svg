<svg class="mtf" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
<style>.mtf{--ink:var(--gray-900,#1a1a1a);--ink2:var(--gray-600,#444);--ink3:var(--gray-400,#6b6b6b);--paper:var(--bg,#f8f8f8);--hot:var(--accent,#C56F34)}
.mtf .ink{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.mtf .ink.h{stroke-width:1.2;opacity:.5}
.mtf .solid{fill:var(--ink)}
.mtf .poche{fill:var(--ink);fill-opacity:.1}
.mtf .fur{fill:none;stroke:var(--ink2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mtf .top{fill:var(--hot);fill-opacity:.17;stroke:none}
.mtf .cover{fill:var(--paper);stroke:none}
.mtf text{font-family:var(--mono,'SF Mono','Fira Code',monospace);letter-spacing:0;font-variant-numeric:tabular-nums;user-select:none}
.mtf .draw{stroke-dasharray:1 2;animation:mtf-draw var(--t,.8s) cubic-bezier(.45,0,.2,1) var(--d,0s) backwards}
.mtf .pop{transform-box:fill-box;transform-origin:50% 50%;animation:mtf-pop var(--t,.35s) cubic-bezier(.3,1.5,.5,1) var(--d,0s) backwards}
.mtf .fade{animation:mtf-fade var(--t,.5s) ease var(--d,0s) backwards}
@keyframes mtf-draw{from{stroke-dashoffset:1.01}}
@keyframes mtf-pop{from{transform:scale(0)}}
@keyframes mtf-fade{from{opacity:0}}
.mtf{--T:14.0s;--d0:1.5s}
.mtf .mod{color:var(--ink);transform:translate(470px,175px) rotate(0deg)}
.mtf .mfill{fill:var(--hot);fill-opacity:.13}
.mtf .mline{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mtf .lot{fill:var(--ink);fill-opacity:.1}
.mtf .lot.pick{fill:var(--hot);fill-opacity:.45}
.mtf .core{fill:none;stroke:var(--hot);stroke-width:1.8}
.mtf .hatch{fill:none;stroke:var(--hot);stroke-width:1;opacity:.35}
.mtf .dim{fill:none;stroke:var(--ink2);stroke-width:1.1;stroke-linecap:round}
.mtf .arrow{fill:none;stroke:var(--ink2);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mtf .num{font-size:15px;fill:var(--ink2)}
.mtf .mid{text-anchor:middle}
.mtf .hb{color:var(--ink);transform-box:fill-box;transform-origin:50% 100%}
.mtf .dyn{animation:mtf-dip var(--T) linear var(--d0) infinite backwards}
.mtf .m1{transform:translate(551px,113.5px) rotate(30deg);animation:mtf-m1 var(--T) linear var(--d0) infinite backwards}.mtf .m2{transform:translate(641px,143.5px) rotate(60deg);animation:mtf-m2 var(--T) linear var(--d0) infinite backwards}.mtf .m3{transform:translate(659px,222.5px) rotate(90deg);animation:mtf-m3 var(--T) linear var(--d0) infinite backwards}.mtf .m4{transform:translate(603.5px,272px) rotate(120deg);animation:mtf-m4 var(--T) linear var(--d0) infinite backwards}.mtf .m5{transform:translate(535px,249px) rotate(150deg);animation:mtf-m5 var(--T) linear var(--d0) infinite backwards}.mtf .m6{transform:translate(517.5px,212px) rotate(180deg);animation:mtf-m6 var(--T) linear var(--d0) infinite backwards}
.mtf .h0{animation:mtf-h0 var(--T) linear var(--d0) infinite backwards}.mtf .h1{animation:mtf-h1 var(--T) linear var(--d0) infinite backwards}.mtf .h2{animation:mtf-h2 var(--T) linear var(--d0) infinite backwards}
@keyframes mtf-m1{0%,6.429%{transform:translate(470px,175px) rotate(0deg);opacity:0;color:var(--hot)}6.571%{transform:translate(470px,175px) rotate(0deg);opacity:1;color:var(--hot);animation-timing-function:cubic-bezier(.6,0,.25,1)}11.786%{transform:translate(551px,113.5px) rotate(30deg);opacity:1;color:var(--hot)}14.643%,92.786%{transform:translate(551px,113.5px) rotate(30deg);opacity:1;color:var(--ink)}92.857%,100%{transform:translate(470px,175px) rotate(0deg);opacity:0;color:var(--hot)}}
@keyframes mtf-m2{0%,13.214%{transform:translate(551px,113.5px) rotate(30deg);opacity:0;color:var(--hot)}13.357%{transform:translate(551px,113.5px) rotate(30deg);opacity:1;color:var(--hot);animation-timing-function:cubic-bezier(.6,0,.25,1)}18.571%{transform:translate(641px,143.5px) rotate(60deg);opacity:1;color:var(--hot)}21.429%,92.786%{transform:translate(641px,143.5px) rotate(60deg);opacity:1;color:var(--ink)}92.857%,100%{transform:translate(551px,113.5px) rotate(30deg);opacity:0;color:var(--hot)}}
@keyframes mtf-m3{0%,20%{transform:translate(641px,143.5px) rotate(60deg);opacity:0;color:var(--hot)}20.143%{transform:translate(641px,143.5px) rotate(60deg);opacity:1;color:var(--hot);animation-timing-function:cubic-bezier(.6,0,.25,1)}25.357%{transform:translate(659px,222.5px) rotate(90deg);opacity:1;color:var(--hot)}28.214%,92.786%{transform:translate(659px,222.5px) rotate(90deg);opacity:1;color:var(--ink)}92.857%,100%{transform:translate(641px,143.5px) rotate(60deg);opacity:0;color:var(--hot)}}
@keyframes mtf-m4{0%,26.786%{transform:translate(659px,222.5px) rotate(90deg);opacity:0;color:var(--hot)}26.929%{transform:translate(659px,222.5px) rotate(90deg);opacity:1;color:var(--hot);animation-timing-function:cubic-bezier(.6,0,.25,1)}32.143%{transform:translate(603.5px,272px) rotate(120deg);opacity:1;color:var(--hot)}35%,92.786%{transform:translate(603.5px,272px) rotate(120deg);opacity:1;color:var(--ink)}92.857%,100%{transform:translate(659px,222.5px) rotate(90deg);opacity:0;color:var(--hot)}}
@keyframes mtf-m5{0%,33.571%{transform:translate(603.5px,272px) rotate(120deg);opacity:0;color:var(--hot)}33.714%{transform:translate(603.5px,272px) rotate(120deg);opacity:1;color:var(--hot);animation-timing-function:cubic-bezier(.6,0,.25,1)}38.929%{transform:translate(535px,249px) rotate(150deg);opacity:1;color:var(--hot)}41.786%,92.786%{transform:translate(535px,249px) rotate(150deg);opacity:1;color:var(--ink)}92.857%,100%{transform:translate(603.5px,272px) rotate(120deg);opacity:0;color:var(--hot)}}
@keyframes mtf-m6{0%,40.357%{transform:translate(535px,249px) rotate(150deg);opacity:0;color:var(--hot)}40.5%{transform:translate(535px,249px) rotate(150deg);opacity:1;color:var(--hot);animation-timing-function:cubic-bezier(.6,0,.25,1)}45.714%{transform:translate(517.5px,212px) rotate(180deg);opacity:1;color:var(--hot)}48.571%,92.786%{transform:translate(517.5px,212px) rotate(180deg);opacity:1;color:var(--ink)}92.857%,100%{transform:translate(535px,249px) rotate(150deg);opacity:0;color:var(--hot)}}
@keyframes mtf-h0{0%,47.143%{transform:scaleY(0);opacity:0}47.286%{transform:scaleY(0);opacity:1;animation-timing-function:cubic-bezier(.6,0,.25,1)}51.429%,92.786%{transform:scaleY(1);opacity:1}92.857%,100%{transform:scaleY(0);opacity:0}}
@keyframes mtf-h1{0%,49.286%{transform:scaleY(0);opacity:0}49.429%{transform:scaleY(0);opacity:1;animation-timing-function:cubic-bezier(.6,0,.25,1)}53.571%,92.786%{transform:scaleY(1);opacity:1}92.857%,100%{transform:scaleY(0);opacity:0}}
@keyframes mtf-h2{0%,51.429%{transform:scaleY(0);opacity:0}51.571%{transform:scaleY(0);opacity:1;animation-timing-function:cubic-bezier(.6,0,.25,1)}55.714%,92.786%{transform:scaleY(1);opacity:1}92.857%,100%{transform:scaleY(0);opacity:0}}
@keyframes mtf-dip{0%,88.571%{opacity:1}91.429%,94.286%{opacity:0}97.143%,100%{opacity:1}}
@media (min-width:769px) and (max-width:1100px){.mtf .num{font-size:19px}}
@media (max-width:768px){.mtf .lots{display:none}.mtf .ink{stroke-width:2.2}.mtf .ink.h{stroke-width:1.8}.mtf .fur{stroke-width:2}.mtf .mline{stroke-width:2.4}.mtf .core{stroke-width:2.4}.mtf .dim{stroke-width:1.6}.mtf .arrow{stroke-width:2}.mtf .num{font-size:22px}}</style>
